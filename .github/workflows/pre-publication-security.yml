name: Pre-publication security gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hook-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test repository pre-commit hook
        run: bash scripts/test-pre-commit-hook.sh
